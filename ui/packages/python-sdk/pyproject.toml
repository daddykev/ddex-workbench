# packages/python-sdk/pyproject.toml
[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ddex-workbench"
version = "1.2.0"
description = "Official Python SDK for DDEX Workbench - Open-source DDEX validation tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "DDEX Workbench Contributors", email = "support@ddex-workbench.org"}
]
keywords = [
    "ddex",
    "ern",
    "music",
    "metadata",
    "validation",
    "xml",
    "music-industry",
    "sdk"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Sound/Audio"
]

dependencies = [
    "requests>=2.28.0,<3",
    "urllib3>=2,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.1.0",
    "responses>=0.22.0",
    "faker>=18.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "flake8-docstrings>=1.7.0",
    "pylint>=2.17.0",
    "mypy>=1.0.0",
    "types-requests>=2.28.0",
    "tox>=4.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
    "wheel>=0.38.0"
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "sphinx-autodoc-typehints>=1.22.0"
]

[project.urls]
Homepage = "https://ddex-workbench.org"
Documentation = "https://ddex-workbench.org/docs"
Repository = "https://github.com/daddykev/ddex-workbench"
Issues = "https://github.com/daddykev/ddex-workbench/issues"